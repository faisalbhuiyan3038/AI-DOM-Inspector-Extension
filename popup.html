<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .primary-btn {
      background: #4285f4;
      color: white;
    }
    .primary-btn:hover {
      background: #357ae8;
    }
    .secondary-btn {
      background: #f1f3f4;
      color: #5f6368;
    }
    .secondary-btn:hover {
      background: #e8eaed;
    }
    .status {
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h2>Element Copier for AI</h2>
  
  <button id="selectElement" class="primary-btn">
    🎯 Select Element
  </button>
  
  <button id="openOptions" class="secondary-btn">
    ⚙️ Settings
  </button>
  
  <div id="status" class="status"></div>

  <!-- Load the polyfill *before* your script -->
  <script src="browser-polyfill.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
